  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# AI Question Generation Configuration
# AI provider switch: legacy (DeepSeekApiClient) or spring-ai (ai-service microservice)
ai:
  provider: ${AI_PROVIDER:legacy}
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8081}
  question:
    # Qiniu Cloud AI Inference API (compatible with OpenAI API format)
    # 通过环境变量 AI_QUESTION_API_KEY 注入，避免硬编码敏感信息
    # 通过环境变量 AI_QUESTION_API_KEY 注入；留空时 ExamAgent 自动回退到内置兜底题库
    api-key: ${AI_QUESTION_API_KEY:}
    api-url: ${AI_QUESTION_API_URL:https://api.qnaigc.com/v1/chat/completions}
    model: ${AI_QUESTION_MODEL:deepseek/deepseek-v4.1-flash}
    # Judge model configuration for LLM-as-a-Judge
    judge-model: deepseek/deepseek-v4.1-flash
    # Retry configuration
    max-retries: 3
    retry-delay-ms: 1000
    # Quality threshold (1-5 scale)
    quality-threshold: 4.0
    # Question generation settings
    default-question-count: 10
    default-question-type: 1  # 1=单选题, 2=多选题, 3=判断题
    default-difficulty: 2  # 1=简单, 2=中等, 3=困难
