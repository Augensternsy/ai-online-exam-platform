apiVersion: apps/v1
kind: Deployment
metadata:
  name: xzs-mysql
  namespace: xzs-exam
  labels:
    app: xzs-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xzs-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xzs-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root123456"
            - name: MYSQL_DATABASE
              value: "ems"
            - name: MYSQL_USER
              value: "xzs"
            - name: MYSQL_PASSWORD
              value: "xzs123456"
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - xzs
                - -pxzs123456
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - xzs
                - -pxzs123456
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
