apiVersion: v1
kind: ConfigMap
metadata:
  name: xzs-backend-config
  namespace: xzs-exam
  labels:
    app: xzs-backend
data:
  # 数据库连接配置
  SPRING_DATASOURCE_URL: "jdbc:mysql://xzs-mysql:3306/ems?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true"
  SPRING_DATASOURCE_USERNAME: "xzs"
  SPRING_DATASOURCE_PASSWORD: "xzs123456"
  
  # Spring Boot 配置
  SPRING_PROFILES_ACTIVE: "docker"
  SERVER_PORT: "8000"
  
  # JVM 配置
  JAVA_OPTS: "-Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom"
  
  # 时区配置
  TZ: "Asia/Shanghai"
