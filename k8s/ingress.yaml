apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xzs-ingress
  namespace: xzs-exam
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: xzs.example.com
      http:
        paths:
          # 前端静态资源
          - path: /student
            pathType: Prefix
            backend:
              service:
                name: xzs-frontend-service
                port:
                  number: 80
          # 后端 API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: xzs-backend-service
                port:
                  number: 8000
