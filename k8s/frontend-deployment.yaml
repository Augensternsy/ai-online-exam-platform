apiVersion: apps/v1
kind: Deployment
metadata:
  name: xzs-frontend
  namespace: xzs-exam
  labels:
    app: xzs-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xzs-frontend
  template:
    metadata:
      labels:
        app: xzs-frontend
    spec:
      containers:
        - name: nginx
          image: xzs-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /student/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /student/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
