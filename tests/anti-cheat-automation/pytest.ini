[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=allure-results
markers =
    anti_cheat: 防作弊相关测试
    critical: 关键功能测试
    integration: 集成测试
